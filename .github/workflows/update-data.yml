name: Update trial data

# 每周一早上（纽约时间约 7:00）自动抓取 ClinicalTrials.gov 并重建网站；也可在 Actions 页手动运行
on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch trials
        run: python scripts/fetch_trials.py --out data/trials.json
      - name: Score preclinical targets (Open Targets)
        # 失败时保留旧文件，不影响后面的步骤
        continue-on-error: true
        run: python scripts/fetch_preclinical.py --out data/preclinical_auto.json
      - name: Check hand-curated lists against FDA approvals (openFDA)
        continue-on-error: true
        run: python scripts/check_watch.py --out data/watch_alerts.json --new-md watch_new.md
      - name: Fetch literature and news for target pages (Europe PMC, Google News)
        continue-on-error: true
        timeout-minutes: 40
        run: python scripts/fetch_feeds.py --index docs/targets_index.json --out docs/feeds.json --top 200
      - name: Build site
        run: python scripts/build_site.py site/template.html data/trials.json docs/index.html
      - name: Commit if changed
        run: |
          git config user.name "readout-bot"
          git config user.email "readout-bot@users.noreply.github.com"
          git add data/trials.json docs/index.html docs/early.json docs/active.json
          for f in data/preclinical_auto.json data/watch_alerts.json docs/feeds.json docs/targets_index.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet || git commit -m "Update trial data $(date -u +%Y-%m-%d)"
          git push
      - name: Open an issue when curated lists need updating
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s watch_new.md ]; then
            gh issue create --title "交易候选需要更新：发现新的 FDA 批准 $(date -u +%Y-%m-%d)" --body-file watch_new.md
          fi
