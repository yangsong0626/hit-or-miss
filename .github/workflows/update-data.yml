name: Update trial data

# 每周一早上（纽约时间约 7:00）自动抓取 ClinicalTrials.gov 并重建网站；也可在 Actions 页手动运行
on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch trials
        run: python scripts/fetch_trials.py --out data/trials.json
      - name: Build site
        run: python scripts/build_site.py site/template.html data/trials.json docs/index.html
      - name: Commit if changed
        run: |
          git config user.name "readout-bot"
          git config user.email "readout-bot@users.noreply.github.com"
          git add data/trials.json docs/index.html
          git diff --cached --quiet || git commit -m "Update trial data $(date -u +%Y-%m-%d)"
          git push
